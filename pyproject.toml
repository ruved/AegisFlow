[project]
name = "aegisflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruved Aalam", email = "ruvedalam7776@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
]

[project.scripts]
aegisflow = "aegisflow:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
